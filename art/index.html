<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp landing page name</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="header-left">
        <a href="index.html">
            <img src="logo.png" alt="Logo" class="logo">
        </a>
    </div>

    <div class="header-center">
        <a href="index.html" class="title-link">
            <h1>Title card</h1>
        </a>
    </div>

    <div class="header-right">
        <a href="#" class="login-btn">Login</a>
    </div>
</header>

<nav class="nav">
    <a href="#">placeholder</a>
    <a href="#">placeholder</a>
    <a href="#">placeholder</a>
</nav>

<div class="container">
    <div class="box">
        <h2 class="box-title">New listings</h2>
        <div class="image-stack">
            <img src="image1.jpg" alt="Image 1">
            <img src="image2.jpg" alt="Image 2">
            <img src="image3.jpg" alt="Image 3">
        </div>
    </div>

    <div class="control-wrapper">
        <div class="control-panel">
            <input type="text" class="search-bar" placeholder="Search...">
            <div class="filter-wrapper">
                <button class="filter-btn">Filters</button>
                <div class="filter-panel">
                    <h4>Sort by</h4>
                    <select name="sort">
                        <option value="">-- Select --</option>
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>

                    <h4>Size</h4>
                    <label><input type="checkbox"> Small</label>
                    <label><input type="checkbox"> Medium</label>
                    <label><input type="checkbox"> Large</label>

                    <h4>Medium</h4>
                    <select name="medium">
                        <option value="">-- Select --</option>
                        <option value="oil">Oil painting</option>
                        <option value="acrylic">Acrylic</option>
                        <option value="digital">Digital</option>
                    </select>

                    <h4>Price</h4>
                    <input type="range" min="0" max="1000">
                </div>
            </div>
        </div>
    </div>

    <div class="box">
        <h2 class="box-title">Active bids</h2>
        <div class="image-stack">
            <img src="image4.jpg" alt="Image 4">
            <img src="image5.jpg" alt="Image 5">
            <img src="image6.jpg" alt="Image 6">
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <div class="contact">
            <h2>Contact us:</h2>
            <p>danielr25@ru.is</p>
            <p>patrik25@ru.is</p>
            <p>nanna25@ru.is</p>
        </div>

        <div class="map">
            <iframe
                src="https://www.google.com/maps?q=Reykjavik+University+Menntavegur+1&output=embed"
                loading="lazy"></iframe>
        </div>
    </div>
</footer>

</body>
</html>

{% extends 'users/../base.html' %}

{% block content %}

<div class="main-content">

    <div class="control-wrapper">
        <div class="control-panel">

            <!-- SAME SEARCH BAR AS ALL OTHER PAGES -->
            <form method="GET">
                <input
                    type="text"
                    class="search-bar"
                    name="q"
                    placeholder="Search..."
                    value="{{ query|default:'' }}"
                >
            </form>

            <!-- FILTER BUTTON (same structure as your other page) -->
            <div class="filter-wrapper">
                <button class="filter-btn">Filters</button>

                <div class="filter-panel">
                    <h4>Sort by</h4>
                    <select name="sort">
                        <option value="">-- Select --</option>
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>

                    <h4>Size</h4>
                    <label><input type="checkbox"> <30cm</label>
                    <label><input type="checkbox"> 30-65cm</label>
                    <label><input type="checkbox"> 65-105cm</label>
                    <label><input type="checkbox"> >105cm</label>

                    <h4>Medium</h4>
                    <select name="medium">
                        <option value="">-- Select --</option>
                        <option value="oil">Oil painting</option>
                        <option value="acrylic">Acrylic</option>
                        <option value="digital">Digital</option>
                    </select>

                    <h4>Price</h4>
                    <input type="range" min="0" max="1000">

                    <button type="submit">Submit</button>
                </div>
            </div>

        </div>

        <!-- GRID -->
        <div class="image-grid">

            {% for item in items %}
                <a href="{% url 'artwork' item.id %}">
                    <div class="card">
                        <h3>{{ item.title }}</h3>
                        <p>{{ item.artist_name }}</p>
                        <p class="sold-tag">SOLD</p>
                    </div>
                </a>
            {% empty %}
                <p>No sold artwork found.</p>
            {% endfor %}

        </div>

    </div>

</div>

{% endblock %}

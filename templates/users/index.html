{% extends 'users/../base.html' %}

{% block content %}

<div class="container">
    <div class="box">
        <h2 class="box-title">New listings</h2>
        <div class="image-stack">
            <a href="{% url 'artwork' %}">
                <img src="image1.jpg" alt="Image 1">
            </a>

            <a href="{% url 'artwork' %}">
                <img src="image2.jpg" alt="Image 2">
            </a>

            <a href="{% url 'artwork' %}">
                <img src="image3.jpg" alt="Image 3">
            </a>
        </div>
    </div>

<div class="control-wrapper">
    <div class="control-panel">
        <input type="text" class="search-bar" placeholder="Search...">
        <div class="filter-wrapper">
            <button class="filter-btn">Filters</button>
            <div class="filter-panel">
                <h4>Sort by</h4>
                <select name="sort">
                    <option value="">-- Select --</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>

                <h4>Size</h4>
                <label><input type="checkbox"> <30cm</label>
                <label><input type="checkbox"> 30-65cm</label>
                <label><input type="checkbox"> 65-105cm</label>
                <label><input type="checkbox"> >105cm</label>

                <h4>Medium</h4>
                <select name="medium">
                    <option value="">-- Select --</option>
                    <option value="oil">Oil painting</option>
                    <option value="acrylic">Acrylic</option>
                    <option value="digital">Digital</option>
                </select>

                <h4>Price</h4>
                <input type="range" min="0" max="1000">

                <button type="submit">Submit</button>
            </div>
        </div>
    </div>

    <div class="sold-box">
        <a href="{% url 'recently_sold' %}">
            <h2 class="sold-title">Recently sold</h2>
        </a>
        <div class="sold-image-row">
            <a href="{% url 'artwork' %}">
                <img src="image7.jpg" alt="Image 7">
            </a>
            <a href="{% url 'artwork' %}">
                <img src="image8.jpg" alt="Image 8">
            </a>
        </div>
    </div>
</div>

    <div class="box">
        <h2 class="box-title">Active bids</h2>
        <div class="image-stack">
            <a href="{% url 'artwork' %}">
                <img src="image4.jpg" alt="Image 4">
            </a>
            <a href="{% url 'artwork' %}">
                <img src="image5.jpg" alt="Image 5">
            </a>
            <a href="{% url 'artwork' %}">
                <img src="image6.jpg" alt="Image 6">
            </a>
        </div>
    </div>
</div>

{% endblock%}

{% extends 'base.html' %}
{% block content %}

<div class="main-content">

{% include 'search_filter.html' %}


    <div class="image-grid">

            {% for item in items %}
                <a href="{% url 'artwork' item.id %}">
                    {% with img=item.images.first %}
                        {% if img %}
                            <img src="{{ img.image.url }}" width="120">
                        {% endif %}
                    {% endwith %}

                    <p>{{ item.title }}</p>
                </a>
            {% endfor %}
    </div>

</div>

{% endblock %}

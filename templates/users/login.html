{% extends 'base.html' %}
{% load i18n %}

{% block content %}

    <form method="POST" class="login-form" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form }}
        <input type="submit" class="submit-L" value="{% trans 'Login' %}">
        <a href="register">{% trans "Don't have an account? Register" %}</a>
    </form>

{% endblock %}

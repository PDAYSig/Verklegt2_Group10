{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/search_filter.js' %}"></script>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="{% url 'users-index' %}">
                <img src="{% static '../media/logo/art_vult_logo1.jpg' %}" alt="Logo" class="logo">
            </a>
        </div>

        <div class="header-center">
            <a class="a" href="{% url 'users-index' %}">
                <h1>ArtVault</h1>
            </a>
        </div>

        <div class="header-right">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">
                    {% if user.profile.profile_image %}
                            <img src="{{ user.profile.profile_image.url }}" class="profile-small">
                        {% else %}
                            <img src="/media/profiles/default_profile.png" class="profile-small">
                    {% endif %}
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="login-btn">Login</a>
            {% endif %}
        </div>
    </header>
    <nav class="nav">
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'all_art' %}">view all art</a>
        <a href="{% url 'create_listing' %}" style="background-color: slategray">Create listing</a>
    </nav>

    {% block content %}
        <!--page specific HTML here-->
    {% endblock %}


    <footer class="footer">
        <div class="footer-content">
            <div class="contact">
                <h2>Contact us:</h2>
                <p>danielr25@ru.is</p>
                <p>patrik25@ru.is</p>
                <p>nanna25@ru.is</p>
            </div>

            <div class="map">
                <iframe
                        src="https://www.google.com/maps?q=Reykjavik+University+Menntavegur+1&output=embed"
                        loading="lazy"></iframe>
            </div>
        </div>
    </footer>

</body>
</html>
